title: "Dungeon Crawler Carl"
author: "Matt Dinniman"
genre: "LitRPG / Dark Comedy / Sci-Fi / Dungeon Apocalypse"
tone: "dark-comedy-vulgar-comic-pacing"
style_notes: "Gaya komik/manhwa dewasa beroktan tinggi, tell-don't-show, sangat menghibur, vulgar maksimal tanpa sensor, tongkrongan gaul santai (gue-lu), notifikasi game RPG sadis dan satir."
pronouns: "gue-lu"

banned_words:
  - "mencicit"
  - "menukas"
  - "menimpali"
  - "tersenyum simpul"
  - "bergumam"
  - "meracau"
  - "mendengus"
  - "budak korporat"
  - "salaryman"
  - "tatkala"
  - "terpendar"
  - "kendati demikian"

forbidden_universe_words:
  - "Ainz"
  - "Albedo"
  - "Nazarick"
  - "Tier Magic"
  - "World Item"
  - "Kwisatz Haderach"
  - "Bene Gesserit"
  - "Spice"
  - "Hogwarts"
  - "Gryffindor"
