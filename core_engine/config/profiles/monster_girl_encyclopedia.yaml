title: Monster Girl Encyclopedia Vol. 1
author: Kenkou Cross
genre: Fantasy / Encyclopedia / Ecchi Lore
tone: casual-uncensored-encyclopedia
style_notes: Gaya santai, ceplas-ceplos, blak-blakan, no sensor, enak dibaca di HP.
pronouns: gue-lu
banned_words:
- mencicit
- menukas
- menimpali
- tersenyum simpul
- bergumam
- meracau
- mendengus
- tatkala
- terpendar
- kendati demikian
key_characters: []
locations_and_factions:
- Demon Realm (Wilayah kekuasaan Demon Lord tempat para monster hidup dan berkembang biak)
- Lescatie (Kota manusia besar yang sering berkonflik dengan pasukan monster)
loanwords:
- Essence (Energi kehidupan positif pria manusia yang terkandung pekat di sperma dan air liur, makanan utama para monster)
- Monster Mana (Energi kehidupan negatif dalam tubuh monster yang terbentuk dari essence yang diserap)
- Monsterization (Proses perubahan manusia wanita menjadi monster akibat menyerap monster mana)
- Mamono (Sebutan umum untuk ras gadis monster di dunia Monster Girl Encyclopedia)
- Incubus (Pria manusia yang berubah menjadi pasangan monster dengan stok essence melimpah)
- Demon Lord (Penguasa tertinggi para monster yang memimpin penyebaran mamono)
